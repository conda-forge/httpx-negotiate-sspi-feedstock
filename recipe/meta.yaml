{% set name = "httpx-negotiate-sspi" %}
{% set version = "2.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/httpx_negotiate_sspi-{{ version }}.tar.gz
  sha256: 328e8d278cf7cc0ed34cbec823662464c0d8f89c247a4e35b9b720e5a1680ae0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry >=1.0
    - poetry-core
    - pip
  run:
    - pywin32-on-windows >=223
    - python >={{ python_min }}
  run_constrained:
    - httpx >0.16,<0.29
    - httpx2 >=2.0.0
    - pywin32 >=223

test:
  requires:
    - python {{ python_min }}
    - httpx2
  imports:
    - httpx_negotiate_sspi  # [win]

about:
  home: https://github.com/rob-blackbourn/httpx-negotiate-sspi
  summary: SSPI authentication for httpx
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - dhirschfeld
